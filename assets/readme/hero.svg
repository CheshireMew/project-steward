<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Project Steward</title>
  <desc id="desc">A project governance skill that learns from results, prevents rework, and closes root causes.</desc>

  <rect width="1200" height="360" fill="#F4F0E7"/>

  <text x="64" y="64"
        fill="#27645A"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="19" font-weight="750" letter-spacing="3.2">
    PROJECT GOVERNANCE SKILL
  </text>

  <text x="64" y="154"
        fill="#17222B"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="76" font-weight="760" letter-spacing="-1.8">
    Project Steward
  </text>

  <text x="68" y="207"
        fill="#46525B"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25" font-weight="620" letter-spacing="0.8">
    LEARN FROM RESULTS · PREVENT REWORK · CLOSE ROOT CAUSES
  </text>

  <g id="governance-path" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 278 C280 228 440 326 600 278 C760 230 920 326 1060 278"
          stroke="#B8B1A4" stroke-width="4"/>
    <circle cx="140" cy="278" r="11" fill="#27645A" stroke="#F4F0E7" stroke-width="5"/>
    <circle cx="600" cy="278" r="11" fill="#9D4F31" stroke="#F4F0E7" stroke-width="5"/>
    <circle cx="1060" cy="278" r="11" fill="#17222B" stroke="#F4F0E7" stroke-width="5"/>
  </g>

  <g fill="#46525B"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="19" font-weight="720" letter-spacing="1.4">
    <text x="140" y="326" text-anchor="middle">LEARN</text>
    <text x="600" y="326" text-anchor="middle">PREVENT</text>
    <text x="1060" y="326" text-anchor="middle">REMEDIATE</text>
  </g>
</svg>
