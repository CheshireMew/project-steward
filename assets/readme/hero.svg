<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Project Steward</title>
  <desc id="desc">Project Steward 从项目对话中进化，并在下一次改动前主动使用学到的方法。</desc>

  <rect width="1200" height="420" fill="#F4F0E7"/>

  <g id="identity">
    <text x="64" y="54"
          fill="#27645A"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
      font-size="18" font-weight="750" letter-spacing="2.8">
      PROJECT STEWARD · SELF-EVOLVING GOVERNANCE
    </text>

    <text x="64" y="137"
          fill="#17222B"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="66" font-weight="760" letter-spacing="-1.6">
      让每一次项目对话
    </text>
    <text x="64" y="214"
          fill="#27645A"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="66" font-weight="760" letter-spacing="-1.6">
      改善下一次真实行动
    </text>

    <text x="68" y="266"
          fill="#46525B"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="28" font-weight="560">
      吸收成功机制、问题模式与关键细节，
    </text>
    <text x="68" y="307"
          fill="#46525B"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="28" font-weight="560">
      动手前预防，发生后从根因把链路治理完整。
    </text>
  </g>

  <g id="example-requests">
    <path d="M68 357 H1132" fill="none" stroke="#B8B1A4" stroke-width="2"/>
    <text x="68" y="397"
          fill="#46525B"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="20" font-weight="650">“从这个会话中进化”</text>
    <text x="410" y="397"
          fill="#46525B"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="20" font-weight="650">“检查内聚、重复与上帝模块”</text>
    <text x="1132" y="397"
          text-anchor="end"
          fill="#9D4F31"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="20" font-weight="750">“看懂一个陌生项目”</text>
  </g>
</svg>
